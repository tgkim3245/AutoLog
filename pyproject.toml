[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-log"
dynamic = ["version"]
description = "Local Windows AutoLog capture control panel"
requires-python = ">=3.14,<3.15"
dependencies = ["PySide6>=6.9,<7", "pywin32>=311; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.5,<5", "ruff>=0.12", "pyinstaller>=6.14,<7"]

[project.scripts]
autolog = "vil_logging.app:main"
auto-log = "vil_logging.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vil_logging*"]

[tool.setuptools.dynamic]
version = {attr = "vil_logging.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
markers = ["hardware: explicit real tool or device tests; excluded from the default suite"]
addopts = "-ra -m 'not hardware'"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
